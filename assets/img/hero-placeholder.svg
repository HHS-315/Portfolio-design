<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" preserveAspectRatio="xMidYMax slice">
  <!-- sky -->
  <rect width="2000" height="1000" fill="#FCFBF8"/>
  <!-- planet ground -->
  <path d="M0 780 Q 500 740 1000 775 T 2000 770 L2000 1000 L0 1000 Z" fill="#E8935A"/>
  <path d="M0 800 Q 500 765 1000 795 T 2000 790 L2000 1000 L0 1000 Z" fill="#E07E44" opacity="0.55"/>
  <!-- craters -->
  <ellipse cx="1250" cy="880" rx="70" ry="16" fill="#C96A34" opacity="0.5"/>
  <ellipse cx="1650" cy="930" rx="55" ry="13" fill="#C96A34" opacity="0.5"/>
  <ellipse cx="820" cy="915" rx="40" ry="10" fill="#C96A34" opacity="0.5"/>
  <!-- rocket (simple line) -->
  <g fill="none" stroke="#3A3A3A" stroke-width="4">
    <path d="M300 330 C 360 330 380 470 380 560 L380 760 L220 760 L220 560 C220 470 240 330 300 330 Z" fill="#FFFFFF"/>
    <line x1="300" y1="250" x2="300" y2="330"/>
    <circle cx="300" cy="240" r="10" fill="#3A3A3A"/>
    <circle cx="330" cy="470" r="26"/>
    <path d="M220 690 L150 780 M380 690 L450 780"/>
  </g>
  <!-- person (simple silhouette) -->
  <g stroke="#3A3A3A" stroke-width="4" fill="none">
    <path d="M540 430 q30 -6 60 0" />
    <rect x="520" y="440" width="90" height="150" rx="20" fill="#1A1A1A" stroke="none"/>
    <rect x="525" y="585" width="80" height="180" rx="10" fill="#FFFFFF"/>
  </g>
  <!-- label -->
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="1300" y="380" font-size="34" fill="#9AA0AE" letter-spacing="8" font-weight="600">HERO IMAGE</text>
    <text x="1300" y="430" font-size="22" fill="#B8BDC8">assets/img/hero.png 로 교체하세요</text>
  </g>
</svg>
